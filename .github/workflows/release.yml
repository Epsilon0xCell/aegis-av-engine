name: aegis-release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read
concurrency:
  group: aegis-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    # The gate that keeps a red run off a published release:
    # the tagged commit must be on main AND must already have
    # a successful aegis-ci run for that exact commit. Tag
    # only after CI is green (see RELEASING.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tagged commit is on main with green CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit $GITHUB_SHA is not on main; refusing to release" >&2
            exit 1
          fi
          ok=$(gh run list --workflow aegis-ci --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq 'length')
          if [ "$ok" != "1" ]; then
            echo "no successful aegis-ci run for $GITHUB_SHA; tag only after CI is green" >&2
            exit 1
          fi
  release:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q -rs
      - name: Reproducible build, twice, into a fresh dist
        run: |
          rm -rf dist
          python scripts/make_release_zip.py dist/a.zip
          python scripts/make_release_zip.py dist/b.zip
          cmp dist/a.zip dist/b.zip
          mv dist/a.zip "dist/aegis-av-engine-${GITHUB_REF_NAME}-source.zip"
          rm dist/b.zip
      - name: Generate the SBOM from the built zip
        run: |
          python -m aegis.cli sbom "dist/aegis-av-engine-${GITHUB_REF_NAME}-source.zip" > "dist/aegis-av-engine-${GITHUB_REF_NAME}.sbom.json"
      - name: Asset set is exactly the two expected files
        shell: bash
        run: |
          expected=$(printf 'aegis-av-engine-%s-source.zip\naegis-av-engine-%s.sbom.json' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" | sort)
          actual=$(ls dist | sort)
          if [ "$actual" != "$expected" ]; then
            echo "dist contents differ from the expected asset set:" >&2
            ls dist >&2
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/aegis-av-engine-${{ github.ref_name }}-source.zip
      - name: Publish release with an explicit asset list
        run: gh release create "${GITHUB_REF_NAME}" "dist/aegis-av-engine-${GITHUB_REF_NAME}-source.zip" "dist/aegis-av-engine-${GITHUB_REF_NAME}.sbom.json" --generate-notes --title "Aegis AV Engine ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the published asset set from the server side
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(printf 'aegis-av-engine-%s-source.zip\naegis-av-engine-%s.sbom.json' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" | sort)
          actual=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "published assets differ from the expected set:" >&2
            echo "$actual" >&2
            exit 1
          fi
